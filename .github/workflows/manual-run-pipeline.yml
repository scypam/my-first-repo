name: Manual Test Run

on:
  workflow_dispatch: #запуск тестов по кнопке на гитхабе

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 #скачать код из репозитория

      - name: Set up Node.js
        uses: actions/setup-node@v4 #установить Node.js
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install #установить зависимости

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps #установить браузеры Playwright

      - name: Run UI tests #запуск UI тестов
        run: npm run tests:ui -- --reporter=html #генерация отчетов
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-ui

      - name: Run API tests #запуск API тестов
        run: npm run tests:api -- --reporter=html
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-api

      - name: Upload UI test report #загрузка отчетов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: playwright-report-ui/
          retention-days: 7

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report-api/
          retention-days: 7